# GRUB A/B boot selection for Swift Linux (UEFI).
#
# Slot state lives in the grub environment block (grubenv) on the ESP. RAUC
# updates ORDER / <slot>_OK / <slot>_TRY there via grub-editenv; this script
# reads them to pick a slot, so a failed update can roll back.
#
# Only `set VAR=...` and if/else are used here: GRUB's script language does
# not handle bare `VAR=value` assignments, and an earlier `for SLOT in $ORDER`
# version silently fell through and booted the wrong slot.

set timeout=3

# Defaults, used when no grubenv exists yet (first boot).
set ORDER="A B"
set A_OK=1
set B_OK=1
set A_TRY=0
set B_TRY=0
load_env

# Which slot does ORDER prefer?
set first="A"
if [ "$ORDER" = "B A" ]; then
	set first="B"
fi

# Boot the preferred slot when it is marked OK, else fall back to the other.
if [ "$first" = "A" ]; then
	if [ "$A_OK" = "1" ]; then
		set default=0
	else
		set default=1
	fi
else
	if [ "$B_OK" = "1" ]; then
		set default=1
	else
		set default=0
	fi
fi

menuentry "Swift Linux (slot A)" {
	set root=(hd0,gpt2)
	linux /boot/bzImage root=PARTUUID=0a0a0a0a-0000-4000-8000-00000000000a ro rootwait rauc.slot=A console=tty1 console=ttyS0
	if [ -e ($root)/boot/initrd ]; then
		initrd /boot/initrd
	fi
}

menuentry "Swift Linux (slot B)" {
	set root=(hd0,gpt3)
	linux /boot/bzImage root=PARTUUID=0b0b0b0b-0000-4000-8000-00000000000b ro rootwait rauc.slot=B console=tty1 console=ttyS0
	if [ -e ($root)/boot/initrd ]; then
		initrd /boot/initrd
	fi
}
