# A/B GPT disk image for QEMU x86_64 (UEFI).
#
#   gpt1  boot    ESP (FAT32) - GRUB (bootx64.efi) + grub.cfg + grubenv
#   gpt2  root-a  EROFS read-only rootfs, slot A
#   gpt3  root-b  EROFS read-only rootfs, slot B (same image at build time)
#   gpt4  data    read-write persistent state (formatted on first boot,
#                 ext4 or f2fs - see S15data / system-install)
#
# Root slots are told apart by their fixed GPT partition UUIDs (the two
# EROFS images are identical, so filesystem UUIDs cannot distinguish them).
#
# root-a/root-b carry an explicit fixed size: EROFS's own output size is
# the compressed content, not a round number, and a partition sized to
# match today's image would not have room for a future RAUC update whose
# rootfs grew. 3G matches the headroom the old fixed-size ext2 image used
# to provide; actual usage is far less; the rest reads as zeroed/sparse
# space, not wasted bytes on real media.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 32M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		# Fixed UUID so /etc/fstab can mount the ESP by partuuid.
		partition-uuid = 0e0e0e0e-0000-4000-8000-00000000000e
		offset = 32K
		bootable = true
	}

	partition root-a {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 0a0a0a0a-0000-4000-8000-00000000000a
		image = "rootfs.erofs"
		size = 3G
	}

	partition root-b {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 0b0b0b0b-0000-4000-8000-00000000000b
		image = "rootfs.erofs"
		size = 3G
	}

	partition data {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = 0d0d0d0d-0000-4000-8000-00000000000d
		size = 1G
	}
}
