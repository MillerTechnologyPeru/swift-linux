# GDM configuration.
#
# No automatic login: this frontend presents the greeter and the user signs
# in. That is also what makes screen locking work - gnome-shell disables it
# outright when there is no display manager to return to.
[daemon]
WaylandEnable=true
AutomaticLoginEnable=false

[security]

[xdmcp]

[chooser]

[debug]
Enable=false
