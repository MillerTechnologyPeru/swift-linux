<?xml version="1.0"?>
<!-- EmulationStation systems for Swift Linux.

     This is the read-only image copy: ES falls back to it last, so a user
     can override everything by writing ~/.emulationstation/es_systems.cfg
     (the home directory is persisted on the data partition).

     User content (the console systems, Apps, Games) lives under /data,
     created by S15data
     on first boot; Tools ships with the image under /usr/share/es-tools.
     ES hides a system whose directory has no matching files, so the empty
     groups stay out of the carousel until something is added to them.

     %ROM% is replaced by ES with the escaped path of the selected entry;
     launched processes inherit the sway session's environment, so Wayland
     applications started from the Apps/Games/Tools groups open normally.

     Apps/Games/Tools entries are .sh scripts or batocera-style .squashfs
     bundles; es-launch dispatches on the extension and loop-mounts the
     bundles for the duration of the run (see /usr/bin/es-launch). -->
<systemList>
	<system>
		<name>nes</name>
		<fullname>Nintendo Entertainment System</fullname>
		<path>/data/roms/nes</path>
		<extension>.nes .NES .unf .UNF .unif .UNIF .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/fceumm_libretro.so %ROM%</command>
		<platform>nes</platform>
		<theme>nes</theme>
	</system>
	<system>
		<name>snes</name>
		<fullname>Super Nintendo</fullname>
		<path>/data/roms/snes</path>
		<extension>.sfc .SFC .smc .SMC .fig .FIG .swc .SWC .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/snes9x_libretro.so %ROM%</command>
		<platform>snes</platform>
		<theme>snes</theme>
	</system>
	<system>
		<name>gbc</name>
		<fullname>Game Boy / Game Boy Color</fullname>
		<path>/data/roms/gbc</path>
		<extension>.gbc .GBC .gb .GB .dmg .DMG .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/gambatte_libretro.so %ROM%</command>
		<platform>gbc</platform>
		<theme>gbc</theme>
	</system>
	<system>
		<name>gba</name>
		<fullname>Game Boy Advance</fullname>
		<path>/data/roms/gba</path>
		<extension>.gba .GBA .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/mgba_libretro.so %ROM%</command>
		<platform>gba</platform>
		<theme>gba</theme>
	</system>
	<system>
		<name>psx</name>
		<fullname>PlayStation</fullname>
		<path>/data/roms/psx</path>
		<extension>.cue .CUE .bin .BIN .img .IMG .chd .CHD .pbp .PBP .m3u .M3U</extension>
		<command>retroarch -L /usr/lib/libretro/pcsx_rearmed_libretro.so %ROM%</command>
		<platform>psx</platform>
		<theme>psx</theme>
	</system>
	<system>
		<name>dos</name>
		<fullname>DOS</fullname>
		<path>/data/roms/dos</path>
		<extension>.dosz .DOSZ .zip .ZIP .exe .EXE .com .COM .bat .BAT .iso .ISO .cue .CUE</extension>
		<command>retroarch -L /usr/lib/libretro/dosbox_pure_libretro.so %ROM%</command>
		<platform>pc</platform>
		<theme>dos</theme>
	</system>
	<system>
		<name>macintosh</name>
		<fullname>Macintosh</fullname>
		<path>/data/roms/macintosh</path>
		<!-- Mini vMac also needs the machine ROM (vMac.ROM) in the
		     RetroArch system directory. -->
		<extension>.dsk .DSK .img .IMG .hfv .HFV .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/minivmac_libretro.so %ROM%</command>
		<platform>macintosh</platform>
		<theme>macintosh</theme>
	</system>
	<system>
		<name>palm</name>
		<fullname>Palm OS</fullname>
		<path>/data/roms/palm</path>
		<!-- Mu also needs the Palm OS ROM (palmos41-en-m515.rom) in
		     the RetroArch system directory. -->
		<extension>.prc .PRC .pdb .PDB .img .IMG .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/mu_libretro.so %ROM%</command>
		<platform>palm</platform>
		<theme>palm</theme>
	</system>
	<system>
		<name>easyrpg</name>
		<fullname>RPG Maker 2000/2003</fullname>
		<path>/data/roms/easyrpg</path>
		<extension>.ldb .LDB .easyrpg .EASYRPG .zip .ZIP</extension>
		<command>retroarch -L /usr/lib/libretro/easyrpg_libretro.so %ROM%</command>
		<platform>easyrpg</platform>
		<theme>easyrpg</theme>
	</system>
	<system>
		<name>scummvm</name>
		<fullname>ScummVM</fullname>
		<path>/data/roms/scummvm</path>
		<!-- A .scummvm file contains the ScummVM game id of the game
		     directory it sits in. -->
		<extension>.scummvm .SCUMMVM</extension>
		<command>retroarch -L /usr/lib/libretro/scummvm_libretro.so %ROM%</command>
		<platform>scummvm</platform>
		<theme>scummvm</theme>
	</system>
	<system>
		<name>lutro</name>
		<fullname>Lutro (Lua)</fullname>
		<path>/data/roms/lutro</path>
		<extension>.lutro .LUTRO .lua .LUA</extension>
		<command>retroarch -L /usr/lib/libretro/lutro_libretro.so %ROM%</command>
		<platform>lutro</platform>
		<theme>lutro</theme>
	</system>
	<system>
		<name>solarus</name>
		<fullname>Solarus</fullname>
		<path>/data/roms/solarus</path>
		<extension>.solarus .SOLARUS</extension>
		<command>solarus-run %ROM%</command>
		<platform>solarus</platform>
		<theme>solarus</theme>
	</system>
	<system>
		<name>love</name>
		<fullname>LOVE</fullname>
		<path>/data/roms/love</path>
		<extension>.love .LOVE</extension>
		<command>love %ROM%</command>
		<platform>love</platform>
		<theme>love</theme>
	</system>
	<system>
		<name>pygame</name>
		<fullname>Pygame</fullname>
		<path>/data/roms/pygame</path>
		<extension>.py .PY</extension>
		<command>python3 %ROM%</command>
		<platform>pygame</platform>
		<theme>pygame</theme>
	</system>
	<system>
		<name>ports</name>
		<fullname>Ports</fullname>
		<path>/data/roms/ports</path>
		<!-- Native game ports, installed by PortMaster (Tools group) or
		     dropped in by hand. Each is a launch script; PortMaster's own
		     directory has no .sh at its top level, so it stays out of the
		     list. -->
		<extension>.sh .SH</extension>
		<command>/usr/bin/es-launch %ROM%</command>
		<platform>ports</platform>
		<theme>ports</theme>
	</system>
	<system>
		<name>apps</name>
		<fullname>Apps</fullname>
		<path>/data/apps</path>
		<extension>.sh .SH .squashfs .SQUASHFS</extension>
		<command>/usr/bin/es-launch %ROM%</command>
		<theme>apps</theme>
	</system>
	<system>
		<name>games</name>
		<fullname>Games</fullname>
		<path>/data/games</path>
		<extension>.sh .SH .squashfs .SQUASHFS</extension>
		<command>/usr/bin/es-launch %ROM%</command>
		<theme>games</theme>
	</system>
	<system>
		<name>tools</name>
		<fullname>Tools</fullname>
		<path>/usr/share/es-tools</path>
		<extension>.sh .SH .squashfs .SQUASHFS</extension>
		<command>/usr/bin/es-launch %ROM%</command>
		<theme>tools</theme>
	</system>
</systemList>
