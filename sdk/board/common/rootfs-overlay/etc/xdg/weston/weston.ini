[core]
# Never blank/lock the single-user appliance display.
idle-time=0
# Software renderer: works on every board (incl. QEMU without GPU accel).
# Boards with a real GPU can override this file via a per-board overlay.
renderer=pixman

[shell]
locking=false
panel-position=bottom

[terminal]
font=DejaVu Sans Mono
font-size=14

[launcher]
icon=/usr/share/weston/icon_window.png
path=/usr/bin/weston-terminal
