# RetroArch defaults for Swift Linux.
#
# This replaces the stock file the package installs. It is intentionally
# short: RetroArch supplies its own default for every key not named here,
# so only the settings this image needs to change are listed.
#
# The rootfs is read-only, so this file is the *seed*, not the live
# config: retro-launch copies it to ~/.config/retroarch/retroarch.cfg on
# first run and RetroArch reads and writes that copy from then on. Editing
# this file changes what a freshly installed image starts with; editing
# the copy changes the running system.
#
# Save paths are deliberately absent. They are per-system and passed on
# the command line by retro-launch (RetroArch can only sort saves by core,
# not by system), and a command-line path wins over anything set here.

# BIOS and firmware. /roms is a symlink to the data partition, so this is
# /data/roms/bios - next to the ROMs, which is where a user goes looking.
# Cores that need one: minivmac (vMac.ROM), mu (a Palm OS ROM).
system_directory = "/roms/bios"

# Screenshots, likewise next to the content.
screenshot_directory = "/roms/screenshots"
auto_screenshot_filename = "true"

# Do not let RetroArch nest its own core-named folder inside the
# per-system save directory retro-launch passes in - one level is enough
# to find things in.
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"

# Cores live in the rootfs; the frontend passes the one it wants.
libretro_directory = "/usr/lib/libretro"

# Save settings when the user asks, not on every exit: an accidental
# change in the menu should not become permanent silently.
config_save_on_exit = "false"
