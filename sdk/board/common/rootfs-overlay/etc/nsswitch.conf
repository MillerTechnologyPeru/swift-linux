# /etc/nsswitch.conf
#
# glibc does not install one by default; this ships it so nss-mdns can resolve
# .local hostnames (mdns4_minimal, before falling through to DNS).

passwd:         files
group:          files
shadow:         files

hosts:          files mdns4_minimal [NOTFOUND=return] dns
networks:       files dns

protocols:      files
services:       files
ethers:         files
rpc:            files
