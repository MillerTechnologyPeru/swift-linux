# umtprd: the MTP responder behind "usbgadget file_transfer". The computer
# sees the device's ROM folders - BIOS files, saves of other machines and
# new games go straight where the frontend looks for them.
#
# The FunctionFS endpoints are the ones usbgadget mounts at /dev/ffs-umtp.

loop_on_disconnect 1

storage "/data/roms" "ROMs" "rw"

manufacturer "Swift Linux"
product "Swift Linux handheld"
serial "00000001"
interface "MTP"

usb_vendor_id  0x1D6B # Linux Foundation
usb_product_id 0x0100 # PTP gadget
usb_class 0x6         # Image
usb_subclass 0x1      # Still Imaging device
usb_protocol 0x1
usb_dev_version 0x3008

usb_functionfs_mode 0x1

usb_dev_path   "/dev/ffs-umtp/ep0"
usb_epin_path  "/dev/ffs-umtp/ep1"
usb_epout_path "/dev/ffs-umtp/ep2"
usb_epint_path "/dev/ffs-umtp/ep3"

usb_max_packet_size 0x200
