# Staged onto the boot partition by post-image.sh, which fills in @DTB@ from
# the board's BR2_LINUX_KERNEL_INTREE_DTS_NAME. U-Boot's extlinux parser is
# strict: no trailing whitespace after the FDT path.
#
# Root is slot A by its fixed GPT partition UUID (see genimage.cfg), so it
# does not matter whether the card enumerates as mmcblk0 or mmcblk1. The
# serial console is UART2 at 1.5 Mbaud, as on upstream's RK3566 images.
LABEL Swift Linux
  LINUX /Image
  FDT /@DTB@
  APPEND root=PARTUUID=0a0a0a0a-0000-4000-8000-00000000000a ro rootwait console=ttyS2,1500000 console=tty0
