# extlinux boot config, staged onto the boot partition. U-Boot's distro-boot
# reads this. The device tree is selected per board at build time (see the
# family post-image.sh, which fills in FDT from the kernel DTS name).
LABEL Swift Linux
    KERNEL /Image
    FDT /DTB
    APPEND root=/dev/mmcblk0p2 rootwait console=tty0 rw
