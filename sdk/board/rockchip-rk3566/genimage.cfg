# SD/eMMC layout for Rockchip RK3566 handhelds:
#   sector 64   u-boot-rockchip.bin (idbloader + U-Boot, ~16 MiB reserved)
#   boot        FAT with kernel Image + dtb + extlinux
#   rootfs      ext4
image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot {
		in-partition-table = false
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition boot {
		partition-type-uuid = "U"
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type-uuid = "root"
		image = "rootfs.ext4"
	}
}

image boot.vfat {
	vfat {
		files = { "Image", "dtb", "extlinux" }
	}
	size = 64M
}
