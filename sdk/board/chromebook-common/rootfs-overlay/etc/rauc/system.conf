[system]
compatible=swift-linux-chromebook
# There is no ChromeOS backend in RAUC: slot selection here is the firmware's
# own, expressed as cgpt attributes on the two kernel partitions, so the custom
# backend below drives cgpt instead of writing a bootloader environment.
bootloader=custom
mountprefix=/mnt/rauc
data-directory=/data/rauc

[handlers]
bootloader-custom-backend=/usr/lib/rauc/cgpt-backend

[keyring]
# Development keyring. Replace with your production certificate before
# accepting signed update bundles.
path=/etc/rauc/keyring.pem

# The kernel partitions Depthcharge chooses between. Each carries its slot's
# signed FIT image; the rootfs it boots is found relative to it via
# root=PARTUUID=%U/PARTNROFF=N, so a kernel slot and its rootfs move together.
[slot.kernel.0]
device=/dev/disk/by-partlabel/KERN-A
type=raw
bootname=A

[slot.kernel.1]
device=/dev/disk/by-partlabel/KERN-B
type=raw
bootname=B

[slot.rootfs.0]
device=/dev/disk/by-partlabel/ROOT-A
type=ext4
parent=kernel.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/ROOT-B
type=ext4
parent=kernel.1
