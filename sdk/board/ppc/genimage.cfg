# A/B disk image for QEMU mac99.
#
#   gpt1  boot    reserved for the GRUB that OpenBIOS will load; empty while
#                 the image boots by QEMU's -kernel
#   gpt2  root-a  EROFS read-only rootfs, slot A (/dev/sda2)
#   gpt3  root-b  EROFS read-only rootfs, slot B (same image at build time)
#   gpt4  data    read-write persistent state, formatted on first boot
#
# GPT with the same fixed partition UUIDs as every other board, because the
# shared S15data and system-install find the boot and data partitions by
# them. OpenBIOS cannot read GPT, but nothing asks it to until the firmware
# boot path is added, and that is where the table is revisited.
#
# The rootfs stays LZ4HC-compressed: the kernel reads it, not GRUB.

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = 0e0e0e0e-0000-4000-8000-00000000000e
		offset = 1M
		size = 32M
	}

	partition root-a {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 0a0a0a0a-0000-4000-8000-00000000000a
		image = "rootfs.erofs"
		size = 4G
	}

	partition root-b {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 0b0b0b0b-0000-4000-8000-00000000000b
		image = "rootfs.erofs"
		size = 4G
	}

	partition data {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = 0d0d0d0d-0000-4000-8000-00000000000d
		size = 1G
	}
}
