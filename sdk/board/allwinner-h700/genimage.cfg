# SD/eMMC layout for Allwinner H700 handhelds:
#   8 KiB       u-boot-sunxi-with-spl.bin (SPL + U-Boot)
#   boot        FAT with kernel Image + dtb + extlinux
#   rootfs      erofs
image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1M
	}

	partition uboot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		partition-type-uuid = "U"
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type-uuid = "root"
		image = "rootfs.erofs"
	}
}

image boot.vfat {
	vfat {
		files = { "Image", "dtb", "extlinux" }
	}
	size = 64M
}
