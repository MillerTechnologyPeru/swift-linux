[system]
compatible=swift-linux-arm64
bootloader=grub
# grubenv on the ESP (mounted at /boot); must match GRUB's $prefix/grubenv.
grubenv=/boot/EFI/BOOT/grubenv
mountprefix=/mnt/rauc
data-directory=/data/rauc

[keyring]
# Development keyring. Replace with your production certificate before
# accepting signed update bundles.
path=/etc/rauc/keyring.pem

# type=raw, not ext4: the payload is a whole prebuilt EROFS image written
# straight to the partition, not a live filesystem RAUC mounts and updates
# in place - and "ext4" is the only mountable type RAUC actually knows here
# (erofs is not in its supported-type list at all, and would be rejected as
# an invalid system.conf). raw is also simply correct for what this is.
[slot.rootfs.0]
device=/dev/disk/by-partuuid/0a0a0a0a-0000-4000-8000-00000000000a
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/0b0b0b0b-0000-4000-8000-00000000000b
type=raw
bootname=B
