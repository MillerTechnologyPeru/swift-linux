# SD-card image for Rockchip RK3326 handhelds.
#
#   sector 64  rk3326-uboot.bin  idbloader + uboot.img + trust.img, outside
#                                the partition table; ends exactly at 16 MiB
#   gpt1       boot    FAT: Image, device tree, extlinux, boot.scr
#   gpt2       root-a  EROFS read-only rootfs (booted)
#   gpt3       root-b  EROFS, same image; spare slot for updates
#   gpt4       data    persistent state, grown to fill the card and
#                      formatted on first boot (S15data)
#
# The partition UUIDs are the ones every image in this repo uses, so
# S15data, fstab and system-install find the partitions unchanged. The GPT
# itself sits in sectors 0-33, clear of the loader at sector 64; the RK3326
# boot ROM only looks at sector 64.
#
# The root slots carry a fixed size with headroom: EROFS output is exactly
# the content, and a slot sized to today's image leaves no room for a
# bigger update. The rootfs here is LZ4HC-compressed (U-Boot never reads
# it), so it is far smaller than on the GRUB boards.

image boot.vfat {
	vfat {
		label = "BOOT"
		file Image { image = "rk3326-boot/Image" }
		file @DTB@ { image = "rk3326-boot/@DTB@" }
		file boot.scr { image = "rk3326-boot/boot.scr" }
		file extlinux { image = "rk3326-boot/extlinux" }
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition loader {
		in-partition-table = false
		image = "rk3326-uboot.bin"
		offset = 32K
	}

	partition boot {
		image = "boot.vfat"
		partition-type-uuid = U
		partition-uuid = 0e0e0e0e-0000-4000-8000-00000000000e
		offset = 16M
		bootable = true
	}

	partition root-a {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		partition-uuid = 0a0a0a0a-0000-4000-8000-00000000000a
		image = "rootfs.erofs"
		size = 4G
	}

	partition root-b {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		partition-uuid = 0b0b0b0b-0000-4000-8000-00000000000b
		image = "rootfs.erofs"
		size = 4G
	}

	partition data {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = 0d0d0d0d-0000-4000-8000-00000000000d
		size = 256M
	}
}
