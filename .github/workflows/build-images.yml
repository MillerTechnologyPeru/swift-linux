name: Build Images

# Builds the Swift Linux A/B UEFI images in the buildroot-swift container,
# which already ships the Swift native toolchain and, in its per-arch
# swift_<arch>_defconfig tags, a prebuilt Buildroot output/<arch> with the
# cross-toolchain and Swift runtime. We reconfigure that cached output dir
# with our image defconfig (our toolchain.config matches theirs, so the
# toolchain and swift are reused) and only the extra packages - sway, mesa,
# GRUB, RAUC, steam, ... - compile. Modeled on MillerTechnologyPeru/
# buildroot-swift's own Buildroot workflow.

# The Swift SDKs are built by a separate workflow (build-swift-sdk.yml): they
# share nothing with the images but the container, and splitting them means a
# broken SDK and a broken image are separate red marks, each re-runnable
# without paying for the other.
#
# A full run builds four Buildroot trees (two images, two 32-bit companions)
# and takes hours, so it is not worth spending on every push: it runs once a
# night, and on demand from the Actions tab (or "gh workflow run
# build-images.yml") when a change needs checking before then.
on:
  schedule:
    # 07:00 UTC - after the working day in the Americas, so the nightly
    # result is waiting in the morning.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  image:
    name: Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-latest
    needs: lib32
    # Per-arch container with Buildroot + a prebuilt output/<arch> (toolchain
    # + host-swift + native Swift tools). Same images buildroot-swift uses.
    container: colemancda/buildroot-swift:swift_${{ matrix.arch }}_defconfig
    env:
      CCACHE_DIR: /workspaces/br-ccache
    steps:
      - name: Checkout swift-linux
        uses: actions/checkout@v4

      # Buildroot and the buildroot-swift external come from the container's
      # cached copies (that is what the prebuilt output/<arch> was built
      # against), so only the ports submodule has to be checked out here.
      #
      # safe.directory first: the workspace directory is created by the runner
      # on the host, while git in a container job runs as root, and git rejects
      # that ownership mismatch as "dubious ownership". actions/checkout marks
      # the directory safe in a throwaway HOME of its own, so the exemption is
      # gone by the time this step runs.
      - name: Check out the ports external
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init ports

      # Shared per-arch ccache (same br-ccache-<arch> namespace as the
      # toolchain and SDK workflows; the cache is repo-scoped).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /workspaces/br-ccache
          key: br-ccache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            br-ccache-${{ matrix.arch }}-

      - name: Fetch the 32-bit companion
        uses: actions/download-artifact@v4
        with:
          # i386 goes with the x86_64 image, armv7 with arm64.
          name: lib32-${{ matrix.arch == 'x86_64' && 'i386' || 'armv7' }}
          path: lib32

      - name: Build image
        run: |
          set -eu
          # In the container the buildroot-swift external + Buildroot + the
          # cached per-arch output all live under /workspaces/buildroot-swift.
          BR_SWIFT=/workspaces/buildroot-swift
          export BUILDROOT="$BR_SWIFT/buildroot"
          export BR2_EXTERNAL_SWIFT="$BR_SWIFT"
          export BR2_EXTERNAL_PORTS="$GITHUB_WORKSPACE/ports"
          export OUTPUT_BASE="$BR_SWIFT/output"
          # Reuse the cached output/<arch> so the toolchain and swift are not
          # rebuilt.
          export IMAGE_OUTPUT_DIR="$BR_SWIFT/output/${{ matrix.arch }}"
          # Merge the companion built by the lib32 job into /usr/lib32 rather
          # than building one here (its toolchain is not cached in this image).
          mkdir -p /tmp/lib32 && tar xzf lib32/lib32-*.tar.gz -C /tmp/lib32
          export LIB32_ROOT=/tmp/lib32/target
          # The container's cached OpenSSL was built without engine support;
          # rebuild it so RAUC (which uses the OpenSSL ENGINE API) can compile.
          export REBUILD_PKGS=libopenssl
          export CCACHE=1
          "$GITHUB_WORKSPACE/build-images.sh" ${{ matrix.arch }}

      - name: Dump build log on failure
        if: failure()
        run: |
          log="/workspaces/buildroot-swift/output/${{ matrix.arch }}-image.log"
          echo "===== tail of $log ====="
          tail -n 200 "$log" || echo "(no log found)"

      - name: Show image
        run: ls -la /workspaces/buildroot-swift/output/${{ matrix.arch }}/images/ || true

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: swift-linux-${{ matrix.arch }}-disk
          path: /workspaces/buildroot-swift/output/${{ matrix.arch }}/images/disk.img
          if-no-files-found: error

      - name: Save ccache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: /workspaces/br-ccache
          key: br-ccache-${{ matrix.arch }}-${{ github.run_id }}


  # The 32-bit companion userland that gets merged into each image as
  # /usr/lib32. It must be built in its own architecture's container (that is
  # where the cross-toolchain is cached); the image job then merges the target
  # tree. i386 pairs with the x86_64 image, armv7 with arm64.
  lib32:
    name: lib32 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [i386, armv7]
    runs-on: ubuntu-latest
    container: colemancda/buildroot-swift:swift_${{ matrix.arch }}_defconfig
    env:
      CCACHE_DIR: /workspaces/br-ccache
    steps:
      - name: Checkout swift-linux
        uses: actions/checkout@v4

      # safe.directory: see the image job above.
      - name: Check out the ports external
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init ports

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /workspaces/br-ccache
          key: br-ccache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            br-ccache-${{ matrix.arch }}-

      - name: Build the 32-bit companion
        run: |
          set -eu
          BR_SWIFT=/workspaces/buildroot-swift
          B="$BR_SWIFT/buildroot"
          O="$BR_SWIFT/output/${{ matrix.arch }}"
          EXT="$BR_SWIFT:$GITHUB_WORKSPACE/ports:$GITHUB_WORKSPACE/external"
          "$GITHUB_WORKSPACE/generate-config.sh" \
            --arch ${{ matrix.arch }} --profile lib32 -o /tmp/lib32.defconfig
          printf 'BR2_CCACHE=y\nBR2_CCACHE_USE_BASEDIR=y\n' >> /tmp/lib32.defconfig
          make -C "$B" O="$O" BR2_EXTERNAL="$EXT" BR2_CCACHE_DIR="$CCACHE_DIR" \
            BR2_DEFCONFIG=/tmp/lib32.defconfig defconfig
          make -C "$B" O="$O" ccache-options \
            CCACHE_OPTIONS="--max-size=1.5G --set-config=compression=true --set-config=compiler_check=content" || true
          FORCE_UNSAFE_CONFIGURE=1 make -C "$B" O="$O" BR2_EXTERNAL="$EXT" BR2_CCACHE_DIR="$CCACHE_DIR"
          tar czf "$GITHUB_WORKSPACE/lib32-${{ matrix.arch }}.tar.gz" -C "$O" target

      - name: Upload companion target tree
        uses: actions/upload-artifact@v4
        with:
          name: lib32-${{ matrix.arch }}
          path: lib32-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Save ccache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: /workspaces/br-ccache
          key: br-ccache-${{ matrix.arch }}-${{ github.run_id }}

  # Fast machinery check without the Swift toolchain: proves the image config
  # resolves and generate-config/build-images plumbing is intact on a plain
  # runner. Does not build (that needs the container); config-only.
  config-check:
    name: Config check (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate image defconfig
        run: |
          ./generate-config.sh --arch ${{ matrix.arch }} --profile image -o /tmp/image.defconfig
          echo "----- generated defconfig -----"
          grep -E '^BR2_(aarch64|x86_64|PACKAGE_(SWAYWM|STEAM|BOX64|MESA3D_GALLIUM_DRIVER_VIRGL)|TARGET_GRUB2_.*_EFI|INIT_BUSYBOX)' /tmp/image.defconfig || true
