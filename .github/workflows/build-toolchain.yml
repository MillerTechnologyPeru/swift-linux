name: Build Toolchain

# Builds the cross toolchain and the expensive host tools (gcc/binutils/
# glibc, host-swift, and whatever host tools the tree pulls - rust for
# ruffle, a boot JDK for openjdk) from source, per architecture, and
# publishes each output tree to the "toolchain-latest" GitHub Release.
#
# This is the from-source replacement for the colemancda/buildroot-swift
# container images the other workflows currently start from: they can seed
# output/<arch> from these release assets instead of from a docker layer.
# Release assets rather than actions/cache because the trees are far past
# the repo's 10 GB cache budget, assets are not evicted after 7 days, and
# a Release gives the toolchain an inspectable, pinnable identity.
#
# Runs on the self-hosted x86 runner (see docs/build.md). That is what makes
# this workflow tractable at all: no 6-hour job cap, more cores, and - the
# thing that actually matters - a disk that survives between runs. /mnt/br
# holds dl/, the per-arch ccaches, the shared host-swift tree and the per-arch
# output trees, so a second run is incremental instead of starting cold. There
# are no actions/cache steps for that reason; the state is already on the box.
#
# Two properties of a persistent runner the steps below are written around:
#   - The output trees must NOT be pruned in place to build the release
#     tarball. Packaging works from a hardlinked staging copy under
#     /mnt/br/pkg/<arch> so the live tree keeps its extracted sources.
#   - Container jobs run as root and leave root-owned files in the workspace,
#     which the next run's actions/checkout (running as the runner user)
#     cannot clean. Every job hands the workspace back on the way out.
#
# GitHub release assets still cap at 2 GiB each, and a compressed output tree
# is larger; the trees ship as split .tar.zst parts that the consumer
# concatenates.
#
# Weekly, not nightly: the toolchain changes when toolchain.config or
# swift.config change, not when board overlays do.
on:
  schedule:
    - cron: '0 3 * * 6'   # Saturday 03:00 UTC
  workflow_dispatch:
    inputs:
      force_republish:
        description: 'Re-package and re-upload host-swift even if this version is already on the release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The old 1.5G cap existed to fit four architectures plus dl/ inside the
  # 10 GB repo-wide actions/cache budget. The caches live on the runner's own
  # disk now, so they can be sized for hit rate instead. One knob for every
  # ccache-options call in this file.
  CCACHE_MAX_SIZE: 20G

jobs:
  # The host Swift toolchain is the same artifact for every architecture, so it
  # is built once here instead of four times in the matrix - which is where the
  # hours went: one run spent 3h13m on it per arch and still had only reached
  # LLVM and clang.
  #
  # It is genuinely shareable, not just similar. host-swift declares no
  # dependency on the cross toolchain (nothing sets HOST_SWIFT_DEPENDENCIES),
  # its configure only clones the Swift sources, it builds with the host
  # compiler, and the buildbot_linux preset targets --host-target linux-x86_64
  # whatever Buildroot is aiming at. The dependency runs the other way: the
  # target swift runtime needs host-swift, the cross toolchain and the sysroot.
  #
  # Built at a fixed path (/mnt/br/shared) rather than in a per-arch output
  # tree, because the build bakes absolute paths into its CMake caches and into
  # the build/llvm symlink. The consuming jobs unpack to that same path and
  # symlink it into their own tree, so every one of those references still
  # resolves. On the self-hosted runner that path persists, so after the first
  # successful run this job is a stamp-guarded no-op.
  host-swift:
    name: Host Swift
    runs-on: [self-hosted, Linux, X64]
    container:
      image: colemancda/buildroot-swift:latest
      options: --volume /mnt:/mnt
    # Generous, not calibrated: the 6-hour hosted-runner cap this used to dodge
    # does not apply here. It exists so a wedged build eventually releases the
    # runner rather than blocking every other workflow forever.
    timeout-minutes: 1440
    permissions:
      contents: write             # uploads assets to the host-swift-latest release
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      BR2_DL_DIR: /mnt/br/dl
      CCACHE_DIR: /mnt/br/ccache/host-swift
    steps:
      - uses: actions/checkout@v4

      - name: Host prerequisites
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            uuid-dev libicu-dev icu-devtools libedit-dev libxml2-dev \
            libsqlite3-dev swig libpython3-dev libblocksruntime-dev \
            libcurl4-openssl-dev systemtap-sdt-dev tzdata zip pkg-config
          if ! command -v gh >/dev/null 2>&1; then
            apt-get install -y --no-install-recommends gh 2>/dev/null || {
              apt-get install -y --no-install-recommends curl ca-certificates
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                -o /usr/share/keyrings/githubcli.gpg
              echo "deb [signed-by=/usr/share/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" \
                > /etc/apt/sources.list.d/github-cli.list
              apt-get update
              apt-get install -y --no-install-recommends gh
            }
          fi
          mkdir -p /mnt/br "$BR2_DL_DIR" "$CCACHE_DIR"

      # Fail in five seconds rather than five hours. /mnt is the runner's own
      # disk and it accumulates: four output trees, the shared host-swift tree,
      # dl/ and the ccaches all live there, and ENOSPC deep into an LLVM build
      # costs the whole run.
      - name: Runner facts and disk guard
        run: |
          set -eu
          echo "runner:      $RUNNER_NAME"
          echo "cpus:        $(nproc)"
          free -h || true
          df -h / /mnt
          avail=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 100 ]; then
            echo "only ${avail}G free on /mnt; host-swift needs ~100G of headroom." >&2
            echo "prune with: rm -rf /mnt/br/output/<arch>   (see docs/build.md)" >&2
            exit 1
          fi

      - name: Check out Buildroot and the externals
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 buildroot swift ports

      # The asset is keyed on this, so a Swift bump republishes rather than
      # silently reusing the previous toolchain.
      - name: Read the Swift version
        id: ver
        run: |
          set -eu
          v=$(sed -n 's/^SWIFT_VERSION *= *//p' swift/package/swift/swift.mk | head -1)
          [ -n "$v" ] || { echo "no SWIFT_VERSION in swift/package/swift/swift.mk" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "swift $v"

      # On a persistent runner the build below is a no-op once it has succeeded
      # once, but packaging and uploading are not: they would re-tar and re-push
      # gigabytes every Saturday for a byte-identical result. Decide here, and
      # say so in the log, rather than finding out from the upload.
      - name: Is this version already published?
        id: pub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VER=${{ steps.ver.outputs.version }}
          if [ "${{ github.event.inputs.force_republish }}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "force_republish set: will package and upload regardless"
            exit 0
          fi
          n=$(gh release view host-swift-latest --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq "[.assets[].name | select(startswith(\"host-swift-$VER.tar.zst.part\"))] | length" \
                2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "host-swift $VER is already on the release ($n parts); skipping package + upload"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "host-swift $VER is not on the release yet"
          fi

      # Only the host-swift package: with no dependencies declared it pulls in
      # neither the cross toolchain nor anything else from the profile. The
      # architecture of the defconfig is irrelevant to what gets built - it just
      # has to be a configured tree.
      #
      # -j is bounded by memory as well as cores: Swift and LLVM link steps are
      # multi-gigabyte apiece, and nproc of them in flight on a desktop OOMs
      # hours in.
      - name: Build host-swift
        run: |
          set -eu
          B="$GITHUB_WORKSPACE/buildroot"
          O=/mnt/br/shared
          EXT="$GITHUB_WORKSPACE/swift:$GITHUB_WORKSPACE/ports:$GITHUB_WORKSPACE/external"
          J=$(nproc)
          M=$(awk '/MemAvailable/{print int($2/1024/1024)}' /proc/meminfo)
          if [ "$((M / 2))" -lt "$J" ]; then J=$((M / 2)); fi
          if [ "$J" -lt 1 ]; then J=1; fi
          echo "building with -j$J (nproc=$(nproc), MemAvailable=${M}G)"
          "$GITHUB_WORKSPACE/generate-config.sh" --arch x86_64 --profile sdk -o /tmp/hs.defconfig
          printf 'BR2_CCACHE=y\nBR2_CCACHE_USE_BASEDIR=y\n' >> /tmp/hs.defconfig
          make -C "$B" O="$O" BR2_EXTERNAL="$EXT" BR2_DL_DIR="$BR2_DL_DIR" \
            BR2_CCACHE_DIR="$CCACHE_DIR" BR2_DEFCONFIG=/tmp/hs.defconfig defconfig
          make -C "$B" O="$O" ccache-options \
            CCACHE_OPTIONS="--max-size=$CCACHE_MAX_SIZE --set-config=compression=true --set-config=compiler_check=content" || true
          FORCE_UNSAFE_CONFIGURE=1 make -C "$B" O="$O" BR2_EXTERNAL="$EXT" \
            BR2_DL_DIR="$BR2_DL_DIR" BR2_CCACHE_DIR="$CCACHE_DIR" -j"$J" host-swift

      # What the consumers actually need, and how big it is. The sizes are
      # reported because the split threshold and the wisdom of shipping the
      # whole build tree depend on them.
      #
      # The two tests are the same pair the matrix jobs run before trusting the
      # shared tree, repeated here because packaging - which used to be what
      # caught a missing swiftc - is now skipped when the version is already
      # published. Without them a broken build could go green.
      - name: Measure
        run: |
          set -eu
          D=/mnt/br/shared/build/host-swift-${{ steps.ver.outputs.version }}
          test -x "$D/build/usr/bin/swiftc" || { echo "no swiftc at $D/build/usr/bin" >&2; exit 1; }
          test -e "$D/build/llvm/lib/cmake/llvm" || { echo "no usable build/llvm at $D" >&2; exit 1; }
          "$D/build/usr/bin/swiftc" --version
          du -sh "$D" || true
          du -sh "$D/build/usr" "$D/swift-source" 2>/dev/null || true
          du -sh "$D"/swift-source/build/buildbot_linux/* 2>/dev/null || true
          df -h /mnt

      - name: Package host-swift
        if: steps.pub.outputs.needed == 'true'
        run: |
          set -eu
          VER=${{ steps.ver.outputs.version }}
          D=/mnt/br/shared/build/host-swift-$VER
          test -x "$D/build/usr/bin/swiftc" || { echo "no swiftc at $D/build/usr/bin" >&2; exit 1; }
          # Ship the stamps up to and including the build, so a consumer skips
          # download/extract/patch/configure/build outright. The install stamp
          # is deliberately dropped: HOST_SWIFT_INSTALL_CMDS writes the SwiftPM
          # destination file with target-specific flags, so it has to run per
          # architecture.
          rm -f "$D"/.stamp_host_installed "$D"/.stamp_installed*
          tar -C /mnt/br/shared/build --zstd -cf /mnt/br/host-swift-$VER.tar.zst \
            host-swift-$VER
          # Release assets cap at 2 GiB, as with the toolchain trees.
          split -b 1900M -d /mnt/br/host-swift-$VER.tar.zst \
            /mnt/br/host-swift-$VER.tar.zst.part
          rm /mnt/br/host-swift-$VER.tar.zst
          ls -lh /mnt/br/host-swift-$VER.tar.zst.part*

      - name: Publish to the host-swift-latest release
        if: steps.pub.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VER=${{ steps.ver.outputs.version }}
          gh release view host-swift-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create host-swift-latest --repo "$GITHUB_REPOSITORY" \
              --title "Host Swift (rolling)" \
              --notes "Host Swift toolchain built from source by build-toolchain.yml and shared across the architecture matrix. Assets are split tar.zst parts: cat host-swift-<ver>.tar.zst.part* | tar --zstd -x" \
              --latest=false
          for a in $(gh release view host-swift-latest --repo "$GITHUB_REPOSITORY" \
                      --json assets --jq '.assets[].name' | grep "^host-swift-$VER\." || true); do
            gh release delete-asset host-swift-latest "$a" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload host-swift-latest /mnt/br/host-swift-$VER.tar.zst.part* \
            --repo "$GITHUB_REPOSITORY"
          # The runner's disk is not thrown away after the job; the parts are
          # reproducible from /mnt/br/shared, so do not leave ~10 GB behind.
          rm -f /mnt/br/host-swift-$VER.tar.zst.part*

      - name: ccache stats
        if: always()
        run: |
          ccache -d "$CCACHE_DIR" -s 2>/dev/null || true
          du -sh "$CCACHE_DIR" "$BR2_DL_DIR" || true
          df -h /mnt

      # The container runs as root; the workspace belongs to the runner user on
      # the host and, unlike a hosted VM, survives the job. Without this the
      # next run's actions/checkout git-cleans as the runner user and hits EPERM
      # on the root-owned submodule trees this job created.
      - name: Return the workspace to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE" || true

  toolchain:
    name: Toolchain (${{ matrix.arch }})
    needs: host-swift
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64, armv7, i386]
    runs-on: [self-hosted, Linux, X64]
    # The plain base image: Debian with the Swift toolchain and the host
    # dependencies both Buildroot and a from-source Swift build need. Not the
    # per-arch swift_<arch>_defconfig tags the image and SDK workflows use -
    # those carry a prebuilt output/<arch>, which is the very thing this
    # workflow exists to rebuild from source. Only the build environment comes
    # from the image; every artifact here is still built from scratch.
    #
    # /mnt is bind-mounted because that is where the heavy trees live, and on
    # the self-hosted runner it is also where they persist between runs.
    container:
      image: colemancda/buildroot-swift:latest
      options: --volume /mnt:/mnt
    timeout-minutes: 720
    permissions:
      contents: write             # uploads assets to the toolchain-latest release
    env:
      BR2_DL_DIR: /mnt/br/dl
      CCACHE_DIR: /mnt/br/ccache/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # No free-disk-space step: it prunes the runner's own filesystem, which a
      # container job cannot see. The heavy trees live on the bind-mounted /mnt
      # instead, which is where the room is.
      - name: Host prerequisites
        run: |
          set -eu
          # No sudo: the container runs as root, and the image has no sudo.
          # The image already carries Buildroot's host dependencies; these are
          # host-swift's own, which building the compiler from source needs and
          # a toolchain-shipping image has no reason to include. Installed as a
          # set rather than one package per failed run, because each discovery
          # costs a four-hour build.
          #
          # uuid-dev is the one that bit us: swift's lib/Basic does
          # find_package(UUID), and without it the swift component never
          # configures - which surfaces hours later as "CMAKE_Swift_COMPILER
          # ... is not a full path to an existing compiler tool" from the
          # target swift package looking for a swiftc that was never produced.
          apt-get update
          apt-get install -y --no-install-recommends \
            uuid-dev libicu-dev icu-devtools libedit-dev libxml2-dev \
            libsqlite3-dev swig libpython3-dev libblocksruntime-dev \
            libcurl4-openssl-dev systemtap-sdt-dev tzdata zip pkg-config
          # gh is preinstalled on a runner but not in the image, and both the
          # shared host-swift download and the release upload need it.
          if ! command -v gh >/dev/null 2>&1; then
            apt-get install -y --no-install-recommends gh 2>/dev/null || {
              apt-get install -y --no-install-recommends curl ca-certificates
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                -o /usr/share/keyrings/githubcli.gpg
              echo "deb [signed-by=/usr/share/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" \
                > /etc/apt/sources.list.d/github-cli.list
              apt-get update
              apt-get install -y --no-install-recommends gh
            }
          fi
          mkdir -p /mnt/br "$BR2_DL_DIR" "$CCACHE_DIR"

      - name: Runner facts and disk guard
        run: |
          set -eu
          echo "runner:      $RUNNER_NAME"
          echo "cpus:        $(nproc)"
          free -h || true
          df -h / /mnt
          avail=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 100 ]; then
            echo "only ${avail}G free on /mnt; a toolchain tree plus its tarball needs ~100G." >&2
            echo "prune with: rm -rf /mnt/br/output/<arch>   (see docs/build.md)" >&2
            exit 1
          fi

      # Everything the build compiles comes from this repo's submodules - the
      # patched Buildroot fork, the buildroot-swift external and the ports
      # external - not from the image, which supplies only the environment.
      # Non-recursive on purpose: the swift submodule's own buildroot pointer
      # is redundant with the top-level one.
      #
      # safe.directory first, as in the image and SDK workflows: the workspace
      # is created by the runner on the host while git here runs as root in the
      # container, and actions/checkout's own exemption lives in a throwaway
      # HOME that is gone by now.
      - name: Check out Buildroot and the externals
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 buildroot swift ports

      # Unpack the shared host-swift to the same absolute path the producer
      # built it at, then point this architecture's tree at it with a symlink.
      # swift.mk guards both expensive steps on directories existing
      # (swift-source for configure, build/llvm for the build), so a populated
      # tree makes them no-ops and only the per-arch install runs.
      #
      # On the self-hosted runner /mnt/br/shared is usually already there from
      # the producing job, and the download is skipped entirely.
      - name: Fetch the shared host-swift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VER=${{ needs['host-swift'].outputs.version }}
          D=/mnt/br/shared/build/host-swift-$VER
          if [ ! -d "$D" ]; then
            mkdir -p /mnt/br/shared/build
            cd /mnt/br
            gh release download host-swift-latest --repo "$GITHUB_REPOSITORY" \
              --pattern "host-swift-$VER.tar.zst.part*"
            cat host-swift-$VER.tar.zst.part* | tar --zstd -x -C /mnt/br/shared/build
            rm -f host-swift-$VER.tar.zst.part*
          fi
          # Fail here rather than four hours later: an incomplete tree would
          # simply re-trigger the build, and a dangling build/llvm symlink
          # would do so silently.
          test -x "$D/build/usr/bin/swiftc" || { echo "shared host-swift has no swiftc" >&2; exit 1; }
          test -e "$D/build/llvm/lib/cmake/llvm" || { echo "shared host-swift has no usable build/llvm" >&2; exit 1; }
          mkdir -p /mnt/br/output/${{ matrix.arch }}/build
          ln -sfn "$D" /mnt/br/output/${{ matrix.arch }}/build/host-swift-$VER
          "$D/build/usr/bin/swiftc" --version

      - name: Build toolchain + host tools (sdk profile)
        run: |
          set -eu
          B="$GITHUB_WORKSPACE/buildroot"
          O=/mnt/br/output/${{ matrix.arch }}
          EXT="$GITHUB_WORKSPACE/swift:$GITHUB_WORKSPACE/ports:$GITHUB_WORKSPACE/external"
          J=$(nproc)
          M=$(awk '/MemAvailable/{print int($2/1024/1024)}' /proc/meminfo)
          if [ "$((M / 2))" -lt "$J" ]; then J=$((M / 2)); fi
          if [ "$J" -lt 1 ]; then J=1; fi
          echo "building with -j$J (nproc=$(nproc), MemAvailable=${M}G)"
          ./generate-config.sh --arch ${{ matrix.arch }} --profile sdk -o /tmp/sdk.defconfig
          printf 'BR2_CCACHE=y\nBR2_CCACHE_USE_BASEDIR=y\n' >> /tmp/sdk.defconfig
          make -C "$B" O="$O" BR2_EXTERNAL="$EXT" BR2_DL_DIR="$BR2_DL_DIR" \
            BR2_CCACHE_DIR="$CCACHE_DIR" BR2_DEFCONFIG=/tmp/sdk.defconfig defconfig
          # compiler_check=content so hits survive the compiler living at a
          # different path in the image and SDK workflows, which share this
          # very directory on the runner's disk.
          make -C "$B" O="$O" ccache-options \
            CCACHE_OPTIONS="--max-size=$CCACHE_MAX_SIZE --set-config=compression=true --set-config=compiler_check=content" || true
          FORCE_UNSAFE_CONFIGURE=1 make -C "$B" O="$O" BR2_EXTERNAL="$EXT" \
            BR2_DL_DIR="$BR2_DL_DIR" BR2_CCACHE_DIR="$CCACHE_DIR" -j"$J"

      # The published tree is the whole output dir minus the bulky per-package
      # build dirs - but each build dir's stamp files must survive, because they
      # are what tells a consuming Buildroot "already built, skip". The
      # extracted sources themselves are only needed to REbuild.
      #
      # Built from a hardlinked staging copy rather than by pruning in place:
      # on this runner the output tree persists, and deleting its sources to
      # make a tarball would throw away the incremental build the next run
      # wants. Hardlinks make the copy cost inodes and no bytes.
      - name: Package output tree
        run: |
          set -eu
          A=${{ matrix.arch }}
          VER=${{ needs['host-swift'].outputs.version }}
          O=/mnt/br/output/$A
          S=/mnt/br/pkg/$A
          rm -rf "$S"
          mkdir -p "$S/build"
          if ! find "$O" -mindepth 1 -maxdepth 1 ! -name build -exec cp -al {} "$S"/ \; ; then
            echo "hardlinking failed (different filesystem?); falling back to a full copy" >&2
            rm -rf "$S"
            mkdir -p "$S/build"
            find "$O" -mindepth 1 -maxdepth 1 ! -name build -exec cp -a {} "$S"/ \;
          fi
          # build/'s own top-level files (packages-file-list.txt, build-time.log)
          # ship; the package subdirectories ship only their stamps.
          find "$O/build" -mindepth 1 -maxdepth 1 -type f -exec cp -a {} "$S/build"/ \;
          ( cd "$O/build" && find . -mindepth 2 -maxdepth 2 \
              \( -name '.stamp_*' -o -name '.br2_*' -o -name '.applied_patches_list' \) \
              -print0 | tar --null -T - -cf - ) | tar -C "$S/build" -xf -
          # host-swift is a symlink into the shared tree, and find above does
          # not follow it. Put a real directory carrying just the stamps into
          # the STAGING tree - the shape the published tree had when every job
          # built host-swift in place - while the live symlink stays put so the
          # next run still skips the eight-hour build.
          L="$O/build/host-swift-$VER"
          if [ -e "$L" ]; then
            mkdir -p "$S/build/host-swift-$VER"
            cp -a "$L"/.stamp_* "$S/build/host-swift-$VER"/ 2>/dev/null || true
          fi
          du -sh "$S"
          tar -C /mnt/br/pkg --zstd -cf /mnt/br/toolchain-$A.tar.zst "$A"
          rm -rf "$S"
          # Release assets cap at 2 GiB apiece: ship split parts, consumers
          # `cat toolchain-<arch>.tar.zst.part* | tar --zstd -x`.
          split -b 1900M -d /mnt/br/toolchain-$A.tar.zst \
            /mnt/br/toolchain-$A.tar.zst.part
          rm /mnt/br/toolchain-$A.tar.zst
          ls -lh /mnt/br/toolchain-$A.tar.zst.part*

      - name: Publish to the toolchain-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release view toolchain-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create toolchain-latest --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain (rolling)" \
              --notes "Rolling from-source toolchains built by build-toolchain.yml. Assets are split tar.zst parts: cat toolchain-<arch>.tar.zst.part* | tar --zstd -x" \
              --latest=false
          # Replace this arch's parts atomically-ish: delete old, upload new.
          for a in $(gh release view toolchain-latest --repo "$GITHUB_REPOSITORY" \
                      --json assets --jq '.assets[].name' | grep "^toolchain-${{ matrix.arch }}\." || true); do
            gh release delete-asset toolchain-latest "$a" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload toolchain-latest /mnt/br/toolchain-${{ matrix.arch }}.tar.zst.part* \
            --repo "$GITHUB_REPOSITORY"
          # Reproducible from the output tree, and this disk is not thrown away.
          rm -f /mnt/br/toolchain-${{ matrix.arch }}.tar.zst.part*

      - name: ccache stats
        if: always()
        run: |
          ccache -d "$CCACHE_DIR" -s 2>/dev/null || true
          du -sh "$CCACHE_DIR" "$BR2_DL_DIR" || true
          df -h / /mnt

      # See the host-swift job: root-owned files in a workspace that outlives
      # the job break the next run's checkout.
      - name: Return the workspace to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE" || true
